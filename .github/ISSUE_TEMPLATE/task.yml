name: Task — feature / sprint work
description: Задача с трассировкой к architecture repo (backend: API, модели, ошибки)
title: '[S+] API: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **cookie-backend:** опишите контракт (эндпоинты, схемы, коды ошибок), миграции и нефункциональные ограничения (rate limit, идемпотентность). В **Companion** укажите номер парной задачи в **cookie-frontend**. Структура секций — см. [github-issue-format.md](https://github.com/COOKieProjectTeam/architecture/blob/main/docs/process/github-issue-format.md) в architecture repo.
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope (in / out)
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace
      description: FR (обязательно). Опционально UC, NFR. Строка «Ref:» — ссылка на architecture repo.
      placeholder: |
        - FR: FR-US-001
        - NFR: …
        - Ref: https://github.com/COOKieProjectTeam/architecture/blob/main/docs/requirements/SRS.md §…
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API contract
      description: Endpoint(s), request schema, response schema, HTTP status codes.
      placeholder: |
        POST /api/v1/auth/login      → 200 { accessToken, expiresIn } | 400 | 401
        GET  /api/v1/recipes         → 200 { items, total, page, pageSize } | 401
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: OpenAPI задокументирован, тесты (unit/integration), happy path + error paths.
    validations:
      required: true
  - type: textarea
    id: companion
    attributes:
      label: Companion (frontend issue)
      description: 'Ссылка или номер парной задачи в cookie-frontend, например: https://github.com/COOKieProjectTeam/cookie-frontend/issues/N'
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
